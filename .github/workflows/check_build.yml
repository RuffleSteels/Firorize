# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Check Build
on:
  # Build on branch pushes and PRs, but not on tag pushes — a tag added to an
  # already-pushed commit would otherwise duplicate the run for that commit.
  # Match all branches explicitly: this runs on every branch push and, because
  # tags aren't branches, naturally skips tag pushes (a `tags-ignore`-only
  # filter stopped branch pushes from triggering at all).
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions (26.1.2 toolchain requires JDK 25)
        java: [ 25 ]
        distro: [ temurin ]
        # and run on both Linux and Windows
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}
      - name: Make Gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build --stacktrace --parallel
      - name: Capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from LTS java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
