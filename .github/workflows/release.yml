name: Release
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Release notes — paste as-is (newlines and indentation are preserved verbatim)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/openjdk/jdk:25-ubuntu
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - run: ./gradlew build publishMods -Pchangelog="$CHANGELOG"
        env:
          CHANGELOG: ${{ inputs.changelog }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
